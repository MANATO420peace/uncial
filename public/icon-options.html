<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Icon Options</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, sans-serif;
    background: #0a0a0f;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }
  .container {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
    max-width: 360px;
  }
  h2 {
    color: rgba(255,255,255,0.4);
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  /* ヘッダー風モック */
  .header-mock {
    background: #0d0d18;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo {
    font-size: 20px;
    font-weight: 900;
    letter-spacing: -0.5px;
  }
  .logo .uni { color: white; }
  .logo .can { color: #63b3ed; }

  .actions {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.75);
    background: transparent;
    border: none;
    cursor: pointer;
    position: relative;
  }
  .icon-btn.highlight {
    background: rgba(255,255,255,0.1);
  }
  .notif-dot {
    width: 7px; height: 7px;
    background: #ef4444;
    border-radius: 50%;
    position: absolute;
    top: 6px; right: 6px;
  }
  .plus-btn {
    width: 36px; height: 36px;
    background: rgba(255,255,255,0.18);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    margin-left: 4px;
  }
  .avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.25);
    margin-left: 4px;
  }

  .label {
    margin-top: 6px;
    font-size: 11px;
    color: rgba(255,255,255,0.3);
    text-align: center;
  }
  .label strong {
    color: rgba(255,255,255,0.7);
  }

  .option {
    display: flex;
    flex-direction: column;
  }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 9px;
    font-weight: 600;
    margin-left: 8px;
    vertical-align: middle;
  }
  .badge.rec { background: rgba(99,179,237,0.2); color: #63b3ed; }
</style>
</head>
<body>
<div class="container">
  <h2>ヘッダーアイコン 変更案</h2>

  <!-- 現在 -->
  <div class="option">
    <div class="header-mock">
      <div class="logo"><span class="uni">uni</span><span class="can">can</span></div>
      <div class="actions">
        <div class="icon-btn">
          <!-- ShoppingBag (現在) -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/>
          </svg>
        </div>
        <div class="icon-btn"><div class="notif-dot"></div>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </div>
        <div class="plus-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </div>
        <div class="avatar"></div>
      </div>
    </div>
    <div class="label">現在：<strong>ShoppingBag</strong>（バッグ）</div>
  </div>

  <!-- 案1: Tag -->
  <div class="option">
    <div class="header-mock">
      <div class="logo"><span class="uni">uni</span><span class="can">can</span></div>
      <div class="actions">
        <div class="icon-btn">
          <!-- Tag -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2H2v10l9.29 9.29a1 1 0 0 0 1.41 0l7.29-7.29a1 1 0 0 0 0-1.41L12 2z"/>
            <path d="M7 7h.01"/>
          </svg>
        </div>
        <div class="icon-btn"><div class="notif-dot"></div>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </div>
        <div class="plus-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </div>
        <div class="avatar"></div>
      </div>
    </div>
    <div class="label">案1：<strong>Tag</strong>（値札）— フリマ感が強い <span class="badge rec">おすすめ</span></div>
  </div>

  <!-- 案2: Store -->
  <div class="option">
    <div class="header-mock">
      <div class="logo"><span class="uni">uni</span><span class="can">can</span></div>
      <div class="actions">
        <div class="icon-btn">
          <!-- Store -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/>
            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
            <path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"/>
            <path d="M2 7h20"/>
            <path d="M22 7v3a2 2 0 0 1-2 2a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 16 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 12 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 8 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 4 12a2 2 0 0 1-2-2V7"/>
          </svg>
        </div>
        <div class="icon-btn"><div class="notif-dot"></div>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </div>
        <div class="plus-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </div>
        <div class="avatar"></div>
      </div>
    </div>
    <div class="label">案2：<strong>Store</strong>（お店）— マーケット感</div>
  </div>

  <!-- 案3: ArrowLeftRight -->
  <div class="option">
    <div class="header-mock">
      <div class="logo"><span class="uni">uni</span><span class="can">can</span></div>
      <div class="actions">
        <div class="icon-btn">
          <!-- ArrowLeftRight -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/>
          </svg>
        </div>
        <div class="icon-btn"><div class="notif-dot"></div>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </div>
        <div class="plus-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </div>
        <div class="avatar"></div>
      </div>
    </div>
    <div class="label">案3：<strong>ArrowLeftRight</strong>（売買の交換）</div>
  </div>

</div>
</body>
</html>
