<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>アイコン比較</title>
<style>
  body { background: #1a1a2e; font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 60px; display: flex; gap: 80px; align-items: flex-start; justify-content: center; }

  .group { display: flex; flex-direction: column; align-items: center; gap: 24px; }
  .name { color: #fff; font-size: 20px; font-weight: 800; letter-spacing: 1px; }
  .desc { color: rgba(255,255,255,0.45); font-size: 14px; text-align: center; line-height: 1.6; }

  /* 512px → 260px */
  .icon { width: 512px; height: 512px; border-radius: 108px; transform: scale(0.508); transform-origin: top center; margin-bottom: -250px; }

  /* 案1 */
  .ic1 {
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .ic1::before {
    content: '';
    position: absolute;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(99,179,237,0.2) 0%, transparent 70%);
    top: -100px; right: -100px;
  }
  .ic1 .mono {
    font-size: 280px; font-weight: 900; color: #fff; line-height: 1;
    position: relative; z-index: 1; letter-spacing: -10px;
    display: flex; align-items: baseline;
  }
  .ic1 .mono span { color: #63b3ed; }

  /* 案2 */
  .ic2 {
    background: #0d0d0d;
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .ic2::before {
    content: '';
    position: absolute;
    width: 500px; height: 500px;
    border-radius: 50%;
    background: conic-gradient(from 120deg, rgba(66,153,225,0.3), rgba(159,122,234,0.3), rgba(66,153,225,0.3));
    filter: blur(80px);
  }
  .ic2 .text {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center;
  }
  .ic2 .main { font-size: 200px; font-weight: 900; color: #fff; line-height: 0.9; letter-spacing: -8px; display: flex; }
  .ic2 .main span { color: #63b3ed; }
  .ic2 .sub { font-size: 42px; font-weight: 700; color: rgba(255,255,255,0.35); letter-spacing: 12px; margin-top: 16px; }

  /* OGP参考 */
  .ogp-ref {
    margin-top: 40px;
    width: 260px;
    padding: 16px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
  }
  .ogp-ref-label { color: rgba(255,255,255,0.3); font-size: 11px; letter-spacing: 2px; margin-bottom: 10px; text-align: center; }
  .ogp-mini {
    width: 100%; aspect-ratio: 1200/630;
    border-radius: 6px;
    background: #0d0d0d;
    display: flex; overflow: hidden;
  }
  .ogp-left {
    width: 35%; border-right: 1px solid rgba(255,255,255,0.08);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 10% 80%, rgba(66,153,225,0.12) 0%, transparent 70%);
  }
  .ogp-logo { font-size: 11px; font-weight: 900; color: #fff; display: flex; }
  .ogp-logo span { color: #63b3ed; }
  .ogp-right {
    flex: 1; padding: 6px 8px;
    display: flex; flex-direction: column; justify-content: center;
    background: radial-gradient(ellipse at 90% 20%, rgba(159,122,234,0.15) 0%, transparent 60%);
  }
  .ogp-title { font-size: 5px; font-weight: 800; color: #fff; line-height: 1.4; }
  .ogp-tags { display: flex; gap: 3px; margin-top: 5px; flex-wrap: wrap; }
  .ogp-tag { background: rgba(66,153,225,0.15); border: 0.5px solid rgba(66,153,225,0.35); color: #63b3ed; border-radius: 2px; padding: 1px 4px; font-size: 4px; }

  .check { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .check-item { display: flex; flex-direction: column; gap: 4px; }
  .check-label { color: rgba(255,255,255,0.4); font-size: 11px; letter-spacing: 1px; }
  .check-bar { height: 4px; border-radius: 2px; }
  .bar-good { background: #48bb78; }
  .bar-mid { background: #ecc94b; }
</style>
</head>
<body>

<!-- 案1 -->
<div class="group">
  <div class="icon ic1">
    <div class="mono">u<span>c</span></div>
  </div>
  <div class="name">案1 — UCモノグラム</div>
  <div class="desc">シンプルで力強い。<br>小サイズでも読みやすい。<br>OGPとカラートーン統一。</div>

  <!-- OGPとの統一感プレビュー -->
  <div class="ogp-ref">
    <div class="ogp-ref-label">OGP との統一感</div>
    <div class="ogp-mini">
      <div class="ogp-left">
        <div class="ogp-logo">uni<span>can</span></div>
      </div>
      <div class="ogp-right">
        <div class="ogp-title">大学生だけの<br>クローズドコミュニティ</div>
        <div class="ogp-tags">
          <div class="ogp-tag">掲示板</div>
          <div class="ogp-tag">フリマ</div>
          <div class="ogp-tag">時間割</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 案2 -->
<div class="group">
  <div class="icon ic2">
    <div class="text">
      <div class="main">uni<span>c</span></div>
      <div class="sub">UNICAN</div>
    </div>
  </div>
  <div class="name">案2 — ロゴタイプ</div>
  <div class="desc">ブランド名がそのまま入る。<br>初見でサービス名がわかる。<br>テキスト多めで覚えやすい。</div>

  <!-- OGPとの統一感プレビュー -->
  <div class="ogp-ref">
    <div class="ogp-ref-label">OGP との統一感</div>
    <div class="ogp-mini">
      <div class="ogp-left">
        <div class="ogp-logo">uni<span>can</span></div>
      </div>
      <div class="ogp-right">
        <div class="ogp-title">大学生だけの<br>クローズドコミュニティ</div>
        <div class="ogp-tags">
          <div class="ogp-tag">掲示板</div>
          <div class="ogp-tag">フリマ</div>
          <div class="ogp-tag">時間割</div>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
