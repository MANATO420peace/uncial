<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ユニキャン ロゴ案</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
    background: #0a1628;
    padding: 48px 24px 80px;
    color: white;
  }
  h1 {
    text-align: center; font-size: 13px; font-weight: 500;
    letter-spacing: 3px; text-transform: uppercase;
    opacity: 0.4; margin-bottom: 56px;
  }

  .logo-section { margin-bottom: 72px; }
  .logo-label {
    text-align: center; font-size: 12px; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase;
    opacity: 0.35; margin-bottom: 32px;
  }

  /* ── 大きいロゴ表示 ── */
  .logo-showcase {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 32px;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }
  .bg-dark { background: #0f1f3d; border-radius: 24px; padding: 32px; }
  .bg-light { background: #f0fafb; border-radius: 24px; padding: 32px; }
  .bg-grad {
    background: linear-gradient(135deg, #0EA5E9 0%, #06B6D4 50%, #14B8A6 100%);
    border-radius: 24px; padding: 32px;
  }
  .bg-label { text-align: center; font-size: 10px; opacity: 0.35; margin-top: 8px; }

  /* ── アプリ内プレビュー ── */
  .app-preview {
    background: linear-gradient(135deg, #0EA5E9, #06B6D4, #14B8A6);
    border-radius: 16px;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    max-width: 340px;
    margin: 0 auto;
    box-shadow: 0 8px 32px rgba(14,165,233,0.35);
  }
  .app-name {
    font-size: 20px; font-weight: 800; color: white;
    letter-spacing: -0.5px;
  }
  .app-preview-label {
    text-align: center; font-size: 10px; opacity: 0.3;
    margin-top: 10px;
  }

  .divider {
    width: 1px; height: 80px; background: rgba(255,255,255,0.08);
    margin: 0 8px;
  }
</style>
</head>
<body>
